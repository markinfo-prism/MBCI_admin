<!DOCTYPE html>
<html lang="ko" class="mbf">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#FFFFFF">
<meta property="og:type" content="website">
<meta property="og:title" content="MBCI · Markinfo Brand Core Indicator">
<meta property="og:description" content="간단한 질문으로 내 브랜드의 코어 이미지를 진단하세요">
<meta property="og:image" content="assets/img/og/default.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/img/brand/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/brand/favicon-192.png">
<link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="assets/css/app.css?v=2.37.0">
</head>
<body>

<header>
  <div class="wrap hd">
    <a class="hd-logo" href="https://markinfo.kr/" id="hdLogo" onclick="return logoClick(event)" title="마크인포 홈페이지로" aria-label="마크인포 홈페이지로 이동">
      <img id="logoImg" alt="마크인포" src="assets/img/brand/markinfo-logo.webp">
    </a>
    <div class="hd-title" id="hdTitle" role="link" tabindex="0" title="첫 화면으로" onclick="goHome()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();goHome()}">MBCI 테스트</div>
    <a class="hd-prism" id="hdPrism" href="https://markinfo.kr/services/45" target="_blank" rel="noopener">마크인포 프리즘<i aria-hidden="true">→</i></a>
  </div>
</header>

<!-- ============ INTRO ============ -->
<section id="intro" class="show">
  <div class="wrap">
    <span class="eyebrow">디자인을 몰라도 3분이면 충분해요</span>
    <h1>내 브랜드 코어는 뭘까?<br><em>MBCI 테스트</em>로 확인해 보세요!</h1>
    <p class="sub">간단한 질문을 통해 내 브랜드가 추구하는<br>비주얼 감성과 로고 스타일을 알 수 있어요.</p>
    <div class="brand-name-box">
      <label for="brandNameInput" class="lbl-center">브랜드 이름 <span class="opt-tag">선택</span></label>
      <input id="brandNameInput" maxlength="24" placeholder="예: 마크인포">
    </div>
    <div class="biz-box">
      <label class="lbl-center">업종 태그 <span class="opt-tag">선택</span></label>
      <div class="biz-chips" id="bizChips"><button type="button" class="biz-chip" data-biz="fnb">F&amp;B</button><button type="button" class="biz-chip" data-biz="beauty">뷰티·코스메틱</button><button type="button" class="biz-chip" data-biz="fashion">패션</button><button type="button" class="biz-chip" data-biz="life">라이프스타일</button><button type="button" class="biz-chip" data-biz="tech">테크·IT</button><button type="button" class="biz-chip" data-biz="finance">금융·핀테크</button><button type="button" class="biz-chip" data-biz="medical">의료·헬스케어</button><button type="button" class="biz-chip" data-biz="edu">교육</button><button type="button" class="biz-chip" data-biz="retail">유통·리테일</button><button type="button" class="biz-chip" data-biz="mfg">제조·산업</button><button type="button" class="biz-chip" data-biz="estate">건축·부동산</button><button type="button" class="biz-chip" data-biz="pro">전문서비스</button><button type="button" class="biz-chip" data-biz="media">미디어·문화·엔터테인먼트</button><button type="button" class="biz-chip" data-biz="travel">여행·숙박</button><button type="button" class="biz-chip" data-biz="public">공공·비영리</button></div>
    </div>
    <div class="btn-start-wrap">
      <button type="button" class="btn-start" id="modeQ">
        <span>테스트 시작하기</span><span class="go">→</span>
      </button>
    </div>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app">
  <div class="wrap">
    <div class="main">

      <!-- left panel: 질문 → (완료 후) 축 게이지 읽기전용 -->
      <aside class="panel">
        <div class="panel-body" id="qWrap">
          <div id="qStage"></div>
          <div id="mbciGauges" class="hidden" aria-live="polite"></div>
        </div>
      </aside>

      <!-- right panel: 브랜드 코어 결과 -->
      <section id="result">
        <div class="placeholder">
          <div class="big">질문에 답하면 브랜드 코어가 나타납니다</div>
          <p>왼쪽에서 테스트를 진행해 주세요. 네 개의 축이 모두 정해지면 이름과 설명이 함께 표시됩니다.</p>
        </div>
      </section>
    </div>
  </div>

</div>

<footer><div class="wrap">
  <div class="foot-meta">MBCI · MARKINFO Brand Core Indicator <span id="verLabel">v0.16.0</span><span class="foot-date"> · <span id="buildDate">2026-10-12</span></span></div>
</div></footer>

<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileInput" accept="image/*" hidden="">

</body>
</html>
